# The identity every gpu-batch Job runs as.
#
# Its one permission lives in the obico repo (rbac-ownership): `get` on
# exactly one Secret, obico/obico-postgres-gpubatch (CNPG since
# argocd-projects#310 AC4; was PGO's obico-postgres-pguser-gpubatch), the
# read-only role the print-state guard uses to tell "printer powered off"
# from "network dropped mid-print".
#
# The token is mounted (the guard reads that Secret through the API), so
# whoever can create pods in this namespace holds that read. Today that is
# only cluster admins: nothing is granted create on jobs/pods here.
# Keep it that way (create-jobs-is-create-pods); a submitter with its own
# SA would get a Role scoped to this namespace and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-batch-runner
  namespace: gpu-batch
