# The identity every gpu-batch Job runs as.
#
# Its one permission lives in the obico repo (rbac-ownership): `get` on
# exactly one Secret, obico/obico-postgres-gpubatch (CNPG since
# argocd-projects#310 AC4; was PGO's obico-postgres-pguser-gpubatch), the
# read-only role the print-state guard uses to tell "printer powered off"
# from "network dropped mid-print".
#
# The token is mounted (the guard reads that Secret through the API), so
# whoever can create pods in this namespace holds that read
# (create-jobs-is-create-pods). That is cluster admins, plus n8n's chains
# through n8n-workflow/n8n-batch-trigger (homelab#1961): `create jobs` only,
# with a per-run token, our images only, and the admission guard in
# cluster/batch-trigger-guard.yaml. Accepted and documented in
# homelab/architecture/gpu-batch-lane.md. Do not add a wider grant.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-batch-runner
  namespace: gpu-batch
