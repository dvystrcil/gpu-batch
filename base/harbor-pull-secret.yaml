# Harbor pull credentials for the gpu-batch namespace.
#
# InfisicalSecret CR per the homelab-secrets convention — NEVER commit
# literal stringData/data for credentials. The Infisical operator
# materializes this into a kubernetes.io/dockerconfigjson Secret named
# `gpu-batch-harbor-pull`, which the Job template references via
# imagePullSecrets.
#
# Pattern copied from nscale-calc / tor-dice — same
# Infisical project, path and template shape. Only secretName changes
# per namespace.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: gpu-batch-harbor-pull
  namespace: gpu-batch
  labels:
    app.kubernetes.io/name: gpu-batch
    app.kubernetes.io/part-of: homelab-app
spec:
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: infisical-operator
      secretsScope:
        envSlug: prod
        projectSlug: homelab-bz-gt
        recursive: false
        secretsPath: /
  # Internal ClusterIP, not the external gateway hostname. Plain HTTP is
  # fine: infisical and infisical-operator are both
  # istio.io/dataplane-mode=ambient, so the wire traffic is already mTLS
  # at the ztunnel L4 layer regardless of application protocol.
  hostAPI: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080/api
  managedSecretReference:
    creationPolicy: Orphan
    secretName: gpu-batch-harbor-pull
    secretNamespace: gpu-batch
    secretType: kubernetes.io/dockerconfigjson
    template:
      data:
        .dockerconfigjson: '{"auths":{"{{ .HB_REGISTRY.Value }}":{"username":"{{ .HB_USERNAME.Value }}","password":"{{ .HB_PASSWORD.Value }}","auth":"{{ .HB_AUTH.Value }}"},"harbor-core.harbor.svc.cluster.local":{"username":"{{ .HB_USERNAME.Value }}","password":"{{ .HB_PASSWORD.Value }}","auth":"{{ .HB_AUTH.Value }}"}}}'
      includeAllSecrets: false
  resyncInterval: 60
