# What n8n's chains may do in this namespace (homelab#1961 AC2).
#
# The subject is the ServiceAccount n8n-workflow/n8n-batch-trigger, which
# lives in dvystrcil/n8n-workflow. Its Role lives here, in the namespace it
# grants into (rbac-ownership). No pod runs as that SA and it has no token
# Secret: the submit command mints a short-lived token per chain run
# (`kubectl create token n8n-batch-trigger -n n8n-workflow --duration=...`)
# and passes it in the chain's webhook call.
#
# The grant, and nothing else:
#   - get cronjobs     read a template's .spec.jobTemplate
#   - create, get jobs start a step, then poll its status
#   - list pods, get pods/log   find the step's pod and read its log tail
# No watch (the chain polls with n8n's Wait node), no delete
# (ttlSecondsAfterFinished cleans up), no secrets, no pods create.
#
# `create jobs` is `create pods`: a Job can run as any SA here and mount any
# Secret here. The ValidatingAdmissionPolicy in ../cluster/batch-trigger-guard.yaml
# narrows what this SA's Jobs may contain, and Pod Security `restricted`
# (namespace.yaml) refuses the resulting pod if anything slips past. The
# residual risk that was accepted is recorded in the (private)
# homelab/architecture/gpu-batch-lane.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: n8n-batch-trigger
  namespace: gpu-batch
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: n8n-batch-trigger
  namespace: gpu-batch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: n8n-batch-trigger
subjects:
  - kind: ServiceAccount
    name: n8n-batch-trigger
    namespace: n8n-workflow
