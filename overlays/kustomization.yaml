resources:
- ../base
- ../cluster
# The image tag. Bumped by a PR that dvystrcil/gpu-batch-docker's
# docker-release workflow opens after it promotes a release. Not by
# argocd-image-updater: IU discovers images from Argo's status.summary.images,
# which lists running workloads and never a CronJob, so on a CronJob-only app
# it would sit green and never move the tag (homelab#951).
#
# bin/gpu-batch-submit reads the image off the live CronJob, so a merged
# bump reaches the next Job with nothing else to update.
images:
- name: harbor.sirddail.net/ai/gpu-batch-blender
  newTag: 0.0.16
- name: harbor.sirddail.net/ai/gpu-batch-freecad
  newTag: 0.0.16

# GPU_BATCH_IMAGE = the container image, tag included, so status.json (and the
# chain report) names the image that ran. It has to be in the template: n8n's
# "Create Job from CronJob" copies the jobTemplate, and a pod cannot read its
# own image (gpu-batch#16). Replacements run after the images: transformer, so
# they copy the bumped tag; tests/test-render.sh checks that on a fake bump.
replacements:
- source:
    kind: CronJob
    name: blender-render
    fieldPath: spec.jobTemplate.spec.template.spec.containers.[name=run].image
  targets:
  - select:
      kind: CronJob
      name: blender-render
    fieldPaths:
    - spec.jobTemplate.spec.template.spec.containers.[name=run].env.[name=GPU_BATCH_IMAGE].value
- source:
    kind: CronJob
    name: freecad-sweep
    fieldPath: spec.jobTemplate.spec.template.spec.containers.[name=run].image
  targets:
  - select:
      kind: CronJob
      name: freecad-sweep
    fieldPaths:
    - spec.jobTemplate.spec.template.spec.containers.[name=run].env.[name=GPU_BATCH_IMAGE].value
